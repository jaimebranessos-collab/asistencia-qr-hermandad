<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner QR - Hermandad</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f5;
      padding: 20px;
      text-align: center;
    }
    .panel {
      background: white;
      max-width: 450px;
      margin: auto;
      padding: 20px;
      border-radius: 15px;
    }
    button {
      background: #16834a;
      color: white;
      border: 0;
      padding: 15px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      margin: 8px 0;
    }
    #reader { width: 100%; margin-top: 15px; }
    #resultado { padding: 15px; background: #eee; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>CONTROL DE ASISTENCIA QR</h2>
    <p>HERMANDAD - SECRETARÍA DE ORGANIZACIÓN</p>

    <button onclick="iniciar()">ACTIVAR CÁMARA</button>
    <button onclick="detener()">DETENER CÁMARA</button>

    <div id="reader"></div>
    <p id="resultado">Esperando cámara...</p>
  </div>

  <script>
    let lector = null;

    async function iniciar() {
      const resultado = document.getElementById("resultado");

      try {
        if (!window.isSecureContext) {
          throw new Error("La página no utiliza HTTPS seguro.");
        }

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error("El navegador no permite acceder a la cámara.");
        }

        if (typeof Html5Qrcode === "undefined") {
          throw new Error("No se pudo cargar el lector QR.");
        }

        if (lector) {
          await lector.stop().catch(() => {});
          lector.clear();
        }

        lector = new Html5Qrcode("reader");

        await lector.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 230 },
          (texto) => {
            resultado.textContent = "QR leído: " + texto;
          }
        );

        resultado.textContent = "¡Cámara activada correctamente!";
      } catch (error) {
        resultado.textContent =
          "ERROR: " + (error.message || String(error));
      }
    }

    async function detener() {
      if (lector && lector.isScanning) {
        await lector.stop();
        lector.clear();
      }
      document.getElementById("resultado").textContent =
        "Cámara detenida.";
    }
  </script>
</body>
</html>
